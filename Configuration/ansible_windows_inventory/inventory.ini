# ==============================================================================
# INVENTORY: inventory.ini
# PURPOSE: Define source and destination Windows servers
# ==============================================================================

[source_server]
# Change this to your source Windows server hostname or IP
source_server ansible_host=192.168.1.100 ansible_user=Administrator

[destination_server]
# Change this to your destination Windows server hostname or IP
destination_server ansible_host=192.168.1.101 ansible_user=Administrator

# ==============================================================================
# Common Windows Variables
# ==============================================================================

[windows:vars]
# Required for Windows with WinRM
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=basic
ansible_winrm_server_cert_validation=ignore

# Optional: Uncomment if using HTTPS/Kerberos
# ansible_port=5986
# ansible_winrm_transport=kerberos

# Optional: Set to 'yes' if SSL certificate validation is needed
# ansible_winrm_server_cert_validation=validate
