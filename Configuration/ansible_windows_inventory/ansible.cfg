# ==============================================================================
# CONFIGURATION: ansible.cfg
# PURPOSE: Ansible configuration for Windows infrastructure management
# ==============================================================================

[defaults]
# Inventory file location
inventory = inventory.ini

# Disable SSH host key checking for Windows environments
host_key_checking = False

# Enable detailed logging
force_color = True
log_path = ./ansible_execution.log

# Increase verbosity level for debugging
verbosity = 0

# Callback plugins for better output
stdout_callback = yaml

# Configure Windows module defaults
module_defaults:
  ansible.windows.win_powershell:
    error_action: continue

# Connection settings
timeout = 60
gathering = smart
gather_subset = all

[privilege_escalation]
# Windows doesn't use traditional privilege escalation like runas
# Enable if running non-admin scripts that need elevation
become = False
become_method = runas

[inventory]
# Parse inventory with host patterns
parse = True
