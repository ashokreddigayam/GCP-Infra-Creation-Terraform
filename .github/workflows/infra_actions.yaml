name: Infrastructure Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TF_VERSION: "1.9.8"   # ~> is Terraform constraint syntax — setup-terraform requires exact semver

jobs:
  # ── Plan: runs on every PR and push ──────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: [self-hosted, windows]
    defaults:
      run:
        working-directory: Infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write GCP credentials from secret
        shell: powershell
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if ($env:GCP_CREDS -and $env:GCP_CREDS.Trim() -ne '') {
            [System.IO.File]::WriteAllText("gcp-sa-key.json", $env:GCP_CREDS, (New-Object System.Text.UTF8Encoding($false)))
          } elseif (Test-Path "C:\Users\ashokg\Downloads\supple-apricot-504106-m6-3e44cc1b3143.json") {
            Copy-Item "C:\Users\ashokg\Downloads\supple-apricot-504106-m6-3e44cc1b3143.json" -Destination "gcp-sa-key.json" -Force
          }


      - name: Terraform Init
        shell: cmd
        run: terraform init -no-color

      - name: Auto-import existing GCP resources
        shell: powershell
        run: |
          $proj = if ("${{ secrets.GCP_PROJECT_ID }}") { "${{ secrets.GCP_PROJECT_ID }}" } else { "supple-apricot-504106-m6" }
          if (Test-Path "gcp-sa-key.json") { gcloud auth activate-service-account --key-file="gcp-sa-key.json" 2>$null }
          $vmExists = gcloud compute instances describe windows-iis-vm --zone=us-central1-a --project=$proj 2>$null
          if ($vmExists) {
            Write-Host "Auto-importing existing VM windows-iis-vm..."
            terraform import -no-color google_compute_instance.windows_vm projects/$proj/zones/us-central1-a/instances/windows-iis-vm 2>$null
          }
          $fwExists = gcloud compute firewall-rules describe allow-iis-http --project=$proj 2>$null
          if ($fwExists) {
            Write-Host "Auto-importing existing firewall allow-iis-http..."
            terraform import -no-color google_compute_firewall.allow_http projects/$proj/global/firewalls/allow-iis-http 2>$null
          }

      - name: Terraform Validate
        shell: cmd
        run: terraform validate -no-color

      - name: Terraform Plan
        shell: cmd
        run: terraform plan -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: Infrastructure/tfplan
          retention-days: 1

  # ── Apply: runs only on push to main ─────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: [self-hosted, windows]
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: Infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write GCP credentials from secret
        shell: powershell
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if ($env:GCP_CREDS -and $env:GCP_CREDS.Trim() -ne '') {
            [System.IO.File]::WriteAllText("gcp-sa-key.json", $env:GCP_CREDS, (New-Object System.Text.UTF8Encoding($false)))
          } elseif (Test-Path "C:\Users\ashokg\Downloads\supple-apricot-504106-m6-3e44cc1b3143.json") {
            Copy-Item "C:\Users\ashokg\Downloads\supple-apricot-504106-m6-3e44cc1b3143.json" -Destination "gcp-sa-key.json" -Force
          }


      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: Infrastructure/

      - name: Terraform Init
        shell: cmd
        run: terraform init -no-color

      - name: Auto-import existing GCP resources
        shell: powershell
        run: |
          $proj = if ("${{ secrets.GCP_PROJECT_ID }}") { "${{ secrets.GCP_PROJECT_ID }}" } else { "supple-apricot-504106-m6" }
          if (Test-Path "gcp-sa-key.json") { gcloud auth activate-service-account --key-file="gcp-sa-key.json" 2>$null }
          $vmExists = gcloud compute instances describe windows-iis-vm --zone=us-central1-a --project=$proj 2>$null
          if ($vmExists) {
            Write-Host "Auto-importing existing VM windows-iis-vm..."
            terraform import -no-color google_compute_instance.windows_vm projects/$proj/zones/us-central1-a/instances/windows-iis-vm 2>$null
          }
          $fwExists = gcloud compute firewall-rules describe allow-iis-http --project=$proj 2>$null
          if ($fwExists) {
            Write-Host "Auto-importing existing firewall allow-iis-http..."
            terraform import -no-color google_compute_firewall.allow_http projects/$proj/global/firewalls/allow-iis-http 2>$null
          }

      - name: Terraform Apply
        shell: cmd
        run: terraform apply -no-color -auto-approve tfplan

      - name: Show Terraform Outputs
        shell: cmd
        run: terraform output -no-color

      # ── Post-apply: gcloud steps ─────────────────────────────────────────────

      - name: Authenticate gcloud CLI
        shell: powershell
        run: |
          if (Test-Path "gcp-sa-key.json") {
            gcloud auth activate-service-account --key-file="gcp-sa-key.json"
          } else {
            Write-Error "gcp-sa-key.json not found for gcloud authentication"
          }

      - name: Create firewall rule — HTTP/HTTPS
        shell: powershell
        run: |
          $proj = if ("${{ secrets.GCP_PROJECT_ID }}") { "${{ secrets.GCP_PROJECT_ID }}" } else { "supple-apricot-504106-m6" }
          $exists = gcloud compute firewall-rules describe allow-iis-traffic --project=$proj 2>$null
          if (-not $exists) {
            gcloud compute firewall-rules create allow-iis-traffic `
              --network=default `
              --allow=tcp:80,tcp:443 `
              --target-tags=iis-server `
              --source-ranges=0.0.0.0/0 `
              --project=$proj
          } else {
            Write-Host "Firewall rule allow-iis-traffic already exists — skipping"
          }

      - name: Create firewall rule — RDP
        shell: powershell
        run: |
          $proj = if ("${{ secrets.GCP_PROJECT_ID }}") { "${{ secrets.GCP_PROJECT_ID }}" } else { "supple-apricot-504106-m6" }
          $exists = gcloud compute firewall-rules describe allow-rdp --project=$proj 2>$null
          if (-not $exists) {
            gcloud compute firewall-rules create allow-rdp `
              --network=default `
              --allow=tcp:3389 `
              --target-tags=iis-server `
              --source-ranges=0.0.0.0/0 `
              --project=$proj
          } else {
            Write-Host "Firewall rule allow-rdp already exists — skipping"
          }

      - name: Write IIS startup PowerShell script
        shell: powershell
        run: |
          $script = @'
          Install-WindowsFeature -Name Web-Server,Web-Default-Doc,Web-Http-Errors,Web-Static-Content,Web-Http-Logging,Web-Asp-Net45,Web-Net-Ext45 -IncludeManagementTools | Out-Null
          netsh advfirewall firewall add rule name="Allow HTTP" protocol=TCP dir=in localport=80 action=allow
          netsh advfirewall firewall add rule name="Allow HTTPS" protocol=TCP dir=in localport=443 action=allow
          $serverName = $env:COMPUTERNAME
          $html = "<html><body><h1>IIS Server is Running</h1><p>Server: $serverName</p></body></html>"
          Set-Content -Path 'C:\inetpub\wwwroot\index.html' -Value $html -Encoding UTF8
          Start-Service W3SVC -ErrorAction SilentlyContinue
          '@
          # Write to workspace root — avoids spaces/special chars that break gcloud --metadata-from-file on Windows
          $scriptPath = "$env:GITHUB_WORKSPACE\iis-setup.ps1"
          Set-Content -Path $scriptPath -Value $script -Encoding UTF8
          Write-Host "Script written to: $scriptPath"

      - name: Push IIS startup script to VM metadata
        shell: powershell
        run: |
          $proj = if ("${{ secrets.GCP_PROJECT_ID }}") { "${{ secrets.GCP_PROJECT_ID }}" } else { "supple-apricot-504106-m6" }
          $scriptPath = "$env:GITHUB_WORKSPACE\iis-setup.ps1"
          # Quoting the entire key=value pair handles Windows paths correctly for gcloud
          gcloud compute instances add-metadata windows-iis-vm `
            --zone=us-central1-a `
            --project=$proj `
            --metadata-from-file "windows-startup-script-ps1=$scriptPath"

      - name: Reset VM to trigger IIS installation
        shell: powershell
        run: |
          $proj = if ("${{ secrets.GCP_PROJECT_ID }}") { "${{ secrets.GCP_PROJECT_ID }}" } else { "supple-apricot-504106-m6" }
          gcloud compute instances reset windows-iis-vm `
            --zone=us-central1-a `
            --project=$proj

      - name: Wait for IIS to come up and verify
        shell: powershell
        run: |
          $publicIp = terraform output -raw public_ip
          Write-Host "Polling http://$publicIp ..."
          for ($i = 1; $i -le 20; $i++) {
            try {
              $res = Invoke-WebRequest -Uri "http://$publicIp" -UseBasicParsing -TimeoutSec 5
              if ($res.StatusCode -eq 200) {
                Write-Host "IIS is up at http://$publicIp"
                exit 0
              }
            } catch {
              Write-Host "Attempt $i — not ready yet"
            }
            Start-Sleep -Seconds 30
          }
          Write-Warning "IIS did not respond with 200 after 10 minutes"
          exit 1
