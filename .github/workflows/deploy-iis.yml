name: Deploy ASP.NET App to IIS

on:
  push:
    branches:
      - main
    paths:
      - 'IIS_SampleApp/**'
  workflow_run:
    workflows: ["Infrastructure Deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH:   'IIS_SampleApp/src/DemoApp/DemoApp.csproj'

jobs:
  build-and-deploy:
    name: Build & Deploy to IIS
    runs-on: [self-hosted, windows]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Write GCP Credentials ─────────────────────────────────────────────
      - name: Write GCP credentials from secret
        shell: powershell
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if ($env:GCP_CREDS -and $env:GCP_CREDS.Trim() -ne '') {
            [System.IO.File]::WriteAllText("gcp-sa-key.json", $env:GCP_CREDS, (New-Object System.Text.UTF8Encoding($false)))
          } elseif (Test-Path "C:\Users\ashokg\Downloads\supple-apricot-504106-m6-3e44cc1b3143.json") {
            Copy-Item "C:\Users\ashokg\Downloads\supple-apricot-504106-m6-3e44cc1b3143.json" -Destination "gcp-sa-key.json" -Force
          }

      # ── 3. Authenticate gcloud ───────────────────────────────────────────────
      - name: Authenticate gcloud CLI
        shell: powershell
        run: |
          if (Test-Path "gcp-sa-key.json") {
            gcloud auth activate-service-account --key-file="gcp-sa-key.json"
          } else {
            Write-Error "gcp-sa-key.json not found for gcloud authentication"
          }

      # ── 4. Retrieve Target VM IP ─────────────────────────────────────────────
      - name: Retrieve Target GCP VM IP
        shell: powershell
        run: |
          $proj = "supple-apricot-504106-m6"
          if ("${{ secrets.GCP_PROJECT_ID }}") { $proj = "${{ secrets.GCP_PROJECT_ID }}" }
          
          $ip = gcloud compute instances describe windows-iis-vm --zone=us-central1-a --project=$proj --format="get(networkInterfaces[0].accessConfigs[0].natIP)" 2>$null
          if (-not $ip) {
            Write-Error "Could not retrieve Public IP for windows-iis-vm in GCP project $proj. Make sure the VM is created and running."
            exit 1
          }
          Write-Host "Target GCP VM Public IP: $ip"
          echo "VM_IP=$ip" >> $env:GITHUB_ENV

      # ── 6. Build & Publish ASP.NET Core App ──────────────────────────────────
      - name: Restore dependencies
        shell: powershell
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build (Release)
        shell: powershell
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish application
        shell: powershell
        run: |
          $pubDir = "$env:GITHUB_WORKSPACE\publish"
          if (Test-Path $pubDir) { Remove-Item -Recurse -Force $pubDir }
          dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release -r win-x64 --self-contained true --output $pubDir
          
          $zipPath = "$env:GITHUB_WORKSPACE\app.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path "$pubDir\*" -DestinationPath $zipPath -Force
          Write-Host "Self-contained application published and compressed to $zipPath"

      # ── 7. Deploy to GCP Windows Server IIS ──────────────────────────────────
      - name: Deploy application to GCP VM IIS
        shell: powershell
        run: |
          $proj = "supple-apricot-504106-m6"
          if ("${{ secrets.GCP_PROJECT_ID }}") { $proj = "${{ secrets.GCP_PROJECT_ID }}" }
          
          $zipPath = "$env:GITHUB_WORKSPACE\app.zip"
          $bytes = [System.IO.File]::ReadAllBytes($zipPath)
          $b64 = [Convert]::ToBase64String($bytes)
          
          # Chunk base64 payload into 400KB chunks to fit GCP metadata limits
          $chunkSize = 400 * 1024
          $totalChunks = [math]::Ceiling($b64.Length / $chunkSize)
          
          Write-Host "Uploading application payload ($totalChunks chunks) to GCP VM metadata..."
          for ($i = 0; $i -lt $totalChunks; $i++) {
            $start = $i * $chunkSize
            $len = [math]::Min($chunkSize, $b64.Length - $start)
            $chunk = $b64.Substring($start, $len)
            $chunkFile = "$env:GITHUB_WORKSPACE\chunk_$i.txt"
            [System.IO.File]::WriteAllText($chunkFile, $chunk, (New-Object System.Text.UTF8Encoding($false)))
            gcloud compute instances add-metadata windows-iis-vm --zone=us-central1-a --project=$proj --metadata-from-file "app-chunk-$i=$chunkFile"
          }
          gcloud compute instances add-metadata windows-iis-vm --zone=us-central1-a --project=$proj --metadata="app-total-chunks=$totalChunks"

          $vmScript = @'
          $ErrorActionPreference = 'SilentlyContinue'
          Import-Module WebAdministration -ErrorAction SilentlyContinue

          # Enable TLS 1.2 for HTTPS downloads on PowerShell 5.1
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # Ensure ASP.NET Core Hosting Bundle is installed on IIS
          $modules = Get-WebGlobalModule | Select-Object -ExpandProperty Name -ErrorAction SilentlyContinue
          if (-not $modules -or $modules -notcontains "AspNetCoreModuleV2") {
            $hostingUrl = "https://download.visualstudio.microsoft.com/download/pr/49e9ce63-e380-4ef1-897b-9c2ae59e74c8/1e737c35f2a1b9e2c6cb3448ff61dfbd/dotnet-hosting-8.0.10-win.exe"
            $installer  = "$env:TEMP\dotnet-hosting.exe"
            Invoke-WebRequest -Uri $hostingUrl -OutFile $installer -UseBasicParsing -ErrorAction SilentlyContinue
            if (Test-Path $installer) {
              $exitCode = 1618
              $attempts = 0
              while ($exitCode -eq 1618 -and $attempts -lt 12) {
                $attempts++
                $proc = Start-Process -FilePath $installer -ArgumentList '/q /norestart' -Wait -PassThru -ErrorAction SilentlyContinue
                if ($proc) { $exitCode = $proc.ExitCode } else { break }
                if ($exitCode -eq 1618) { Start-Sleep -Seconds 5 }
              }
              net stop was /y -ErrorAction SilentlyContinue
              net start w3svc -ErrorAction SilentlyContinue
            }
          }

          # Reassemble base64 app payload from metadata chunks
          $totalChunks = Invoke-RestMethod -Headers @{"Metadata-Flavor"="Google"} -Uri "http://metadata.google.internal/computeMetadata/v1/instance/attributes/app-total-chunks" -UseBasicParsing
          if ($totalChunks) {
            $b64 = ""
            for ($i = 0; $i -lt [int]$totalChunks; $i++) {
              $chunk = Invoke-RestMethod -Headers @{"Metadata-Flavor"="Google"} -Uri "http://metadata.google.internal/computeMetadata/v1/instance/attributes/app-chunk-$i" -UseBasicParsing
              $b64 += $chunk
            }

            $bytes = [Convert]::FromBase64String($b64)
            $destZip = "$env:TEMP\app_deploy.zip"
            [System.IO.File]::WriteAllBytes($destZip, $bytes)

            $webRoot = "C:\inetpub\wwwroot"
            
            # Stop site & app pool to release file locks
            Stop-WebSite -Name "Default Web Site" -ErrorAction SilentlyContinue
            Stop-WebAppPool -Name "DefaultAppPool" -ErrorAction SilentlyContinue

            # Clear old default static files
            Remove-Item -Path "$webRoot\*" -Recurse -Force -ErrorAction SilentlyContinue

            # Unpack ASP.NET Core app files
            Expand-Archive -Path $destZip -DestinationPath $webRoot -Force

            # Configure IIS App Pool for ASP.NET Core (No Managed Code)
            $poolPath = "IIS:\AppPools\DefaultAppPool"
            Set-ItemProperty $poolPath -Name managedRuntimeVersion -Value ""
            Set-ItemProperty $poolPath -Name startMode -Value "AlwaysRunning"

            # Point site to wwwroot
            Set-ItemProperty "IIS:\Sites\Default Web Site" -Name physicalPath -Value $webRoot

            # Restart IIS Services
            Start-WebAppPool -Name "DefaultAppPool" -ErrorAction SilentlyContinue
            Start-WebSite -Name "Default Web Site" -ErrorAction SilentlyContinue
            net start w3svc -ErrorAction SilentlyContinue
            
            Write-EventLog -LogName Application -Source "GCPStartup" -EntryType Information -EventId 100 -Message "ASP.NET Core IIS deployment complete" -ErrorAction SilentlyContinue
          }
          '@

          $vmScriptFile = "$env:GITHUB_WORKSPACE\vm-deploy.ps1"
          [System.IO.File]::WriteAllText($vmScriptFile, $vmScript, (New-Object System.Text.UTF8Encoding($false)))

          Write-Host "Triggering deployment script on GCP VM..."
          gcloud compute instances add-metadata windows-iis-vm --zone=us-central1-a --project=$proj --metadata-from-file "windows-startup-script-ps1=$vmScriptFile"

          Write-Host "Restarting GCP VM to execute ASP.NET Core deployment script..."
          $ErrorActionPreference = 'SilentlyContinue'
          gcloud compute instances reset windows-iis-vm --zone=us-central1-a --project=$proj --quiet
          Write-Host "VM reset issued successfully."

      # ── 8. Health Check Verification ──────────────────────────────────────────
      - name: Verify application deployment (health check)
        shell: powershell
        run: |
          $ip = "$env:VM_IP"
          Write-Host "Polling ASP.NET Core Application at http://$ip ..."
          for ($i = 1; $i -le 24; $i++) {
            try {
              $res = Invoke-WebRequest -Uri "http://$ip" -UseBasicParsing -TimeoutSec 5
              if ($res.StatusCode -eq 200 -and ($res.Content -match "Deployment verification dashboard|Application is running successfully on IIS|DemoApp")) {
                Write-Host "SUCCESS: ASP.NET Core Application (IIS_SampleApp) deployed successfully and live at http://$ip!"
                exit 0
              }
            } catch {
              Write-Host "Attempt $i - waiting for ASP.NET Core app to initialize after reboot..."
            }
            Start-Sleep -Seconds 10
          }
          Write-Warning "Application did not respond with 200 after 4 minutes"
          exit 1
